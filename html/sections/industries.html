<!-- ======================================================
  Industries (Bento Control-Panel Grid)
  Board: 12x6
  Sizes: E=6x4, M=4x2, S=2x2
  Count: 1E + 5M + 2S (no gaps)
  Behavior:
    - Auto loop rotates the active industry
    - Click any tile to make it Elaborative (E)
    - Grid reflows in 4 expansion zones (A/B/C/D) like iOS Control Center
====================================================== -->

<section id="industries" class="ind">
  <div class="ind-inner">
    <header class="ind-head">
      <h2 class="ind-title">Industries</h2>
      <p class="ind-sub">
        Click any industry to expand — the grid reshuffles like a control panel while keeping a clean, gap-free layout.
      </p>

    <div class="ind-grid zone-a" data-ind-grid="true" aria-label="Industries bento grid">
      <!-- NOTE: JS assigns data-slot="E|M1..M5|S1..S2" and toggles the active industry. -->

      <article class="ind-tile" data-industry="1" data-slot="E">

          <span class="ind-chip">Industry 01</span>
          <div class="ind-compact" aria-hidden="true">
            <h3 class="ind-name">Healthcare</h3>
            <p class="ind-line">Credentialing, workflows, and secure data handling.</p>
          </div>
          <div class="ind-elab" aria-hidden="false">
            <h3 class="ind-name">Healthcare</h3>
            <p class="ind-lead">Secure platforms for verification, scheduling, and patient-facing operations.</p>

              <li>Credentialing + verification workflows that reduce manual work</li>

            <div class="ind-cta"><span>Explore workflows</span><span aria-hidden="true">→</span></div>
